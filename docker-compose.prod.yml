services:
  db:
    image: postgres:16-alpine
    container_name: everythinganything_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-production_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-everythinganything_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-everythinganything_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network
    # In production, db is NOT published to host ports to prevent public network exposure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: everythinganything_backend_prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-production_secure_password}@db:5432/${POSTGRES_DB:-everythinganything_prod}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network
      - public_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: everythinganything_frontend_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - public_network

volumes:
  pgdata_prod:

networks:
  internal_network:
    driver: bridge
  public_network:
    driver: bridge

